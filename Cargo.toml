[package]
name = "dang"
version = "0.1.0"
edition = "2021"

[dependencies]
tree-sitter = "~0.20.10"
tree-sitter-dang = { path = "tree-sitter-dang" }
rustyline = "14.0.0"
dirs = "5.0.1"
pest = "2.7.10"
pest_derive = { version = "2.7.10", features = ["grammar-extras"] }
clap = { version = "4.5.7", features = ["derive"] }
unescape = "0.1.0"
include_dir = "0.7.4"
